<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre A1 班级平台 · 南京金地未来学校</title>
  <meta name="description" content="南京金地未来学校国际高中 Pre A1 班的数字之家：课程、成员、相册、班级角，都在这里。">
  <link rel="icon" type="image/png" href="assets/weibiaoti-12222.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home" class="page-enter">

  <!-- ======== 导航栏 ======== -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-logo-badge"><img class="brand-logo" src="assets/weibiaoti-12222.png" alt="南京金地未来学校"></span>
        <span>
          <span class="brand-name">Pre A1</span>
          <span class="brand-sub">Class Hub · 班级平台</span>
        </span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="index.html" data-page="home" data-i18n="nav.home"></a>
        <a href="timetable.html" data-page="timetable" data-i18n="nav.timetable"></a>
        <a href="members.html" data-page="members" data-i18n="nav.members"></a>
        <a href="gallery.html" data-page="gallery" data-i18n="nav.gallery"></a>
      </nav>
      <div class="nav-actions">
        <button class="lang-btn" aria-label="Switch language">EN</button>
        <button class="icon-btn theme-btn" data-i18n-aria="theme.dark">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn hamburger" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ======== 移动端抽屉 ======== -->
  <aside class="drawer" aria-label="移动端导航">
    <div class="drawer-head">
      <span class="brand">
        <span class="brand-logo-badge"><img class="brand-logo" src="assets/weibiaoti-12222.png" alt="南京金地未来学校"></span>
        <span><span class="brand-name">Pre A1</span><span class="brand-sub">Class Hub</span></span>
      </span>
      <button class="icon-btn drawer-close" data-i18n-aria="nav.close" aria-label="关闭菜单">✕</button>
    </div>
    <nav>
      <a href="index.html" data-page="home"><span class="idx">01</span><span data-i18n="nav.home">首页</span></a>
      <a href="timetable.html" data-page="timetable"><span class="idx">02</span><span data-i18n="nav.timetable">课程表</span></a>
      <a href="members.html" data-page="members"><span class="idx">03</span><span data-i18n="nav.members">班级成员</span></a>
      <a href="gallery.html" data-page="gallery"><span class="idx">04</span><span data-i18n="nav.gallery">活动相册</span></a>
    </nav>
  </aside>
  <div class="backdrop" aria-hidden="true"></div>

  <main>
    <!-- ======== Hero 英雄区 ======== -->
    <section class="hero">
      <div class="container hero-inner">
        <div>
          <div class="hero-crest"><span class="crest-line" aria-hidden="true"></span><span data-i18n="hero.crest"></span></div>
          <h1 class="display">Pre&nbsp;<span class="amp">A1</span></h1>
          <p class="hero-tagline" data-i18n="hero.tagline"></p>
          <div class="hero-motto" id="hero-motto" aria-hidden="true"></div>
          <div class="hero-actions">
            <a class="btn btn-gold" href="timetable.html" data-i18n="hero.cta.timetable"></a>
            <a class="btn btn-ghost" href="members.html" data-i18n="hero.cta.members"></a>
          </div>
        </div>
        <aside class="hero-panel reveal">
          <div class="panel-title" data-i18n="hero.panel.title"></div>
          <img class="hero-photo" id="hero-photo" alt="班级合照" hidden>
          <div class="hero-stats" id="hero-stats"></div>
        </aside>
      </div>
    </section>

    <!-- ======== 今日一览 ======== -->
    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="sec.today.eyebrow"></span>
          <h2 class="display h2" data-i18n="sec.today.title"></h2>
          <p data-i18n="sec.today.sub"></p>
        </div>
        <div class="today-grid stagger">
          <div class="card today-card reveal">
            <div class="card-head">
              <span class="today-icon" aria-hidden="true">📚</span>
              <h3 data-i18n="today.classes"></h3>
              <small id="today-date"></small>
            </div>
            <div class="today-body" id="today-classes"></div>
          </div>
          <div class="card today-card reveal">
            <div class="card-head">
              <span class="today-icon" aria-hidden="true">🧹</span>
              <h3 data-i18n="today.duty"></h3>
            </div>
            <div class="today-body" id="today-duty"></div>
          </div>
          <div class="card today-card reveal">
            <div class="card-head">
              <span class="today-icon" aria-hidden="true">🎂</span>
              <h3 data-i18n="today.birthday"></h3>
            </div>
            <div class="today-body" id="today-birthday"></div>
          </div>
          <div class="card today-card reveal">
            <div class="card-head">
              <span class="today-icon" aria-hidden="true">⏰</span>
              <h3 data-i18n="today.deadline"></h3>
            </div>
            <div class="today-body" id="today-deadline"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ======== 重要日子倒计时 ======== -->
    <section class="section band">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="sec.countdown.eyebrow"></span>
          <h2 class="display h2" data-i18n="sec.countdown.title"></h2>
          <p data-i18n="sec.countdown.sub"></p>
        </div>
        <div class="countdown-grid stagger" id="countdown-grid"></div>
      </div>
    </section>

    <!-- ======== 班级快讯 ======== -->
    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="sec.news.eyebrow"></span>
          <h2 class="display h2" data-i18n="sec.news.title"></h2>
          <p data-i18n="sec.news.sub"></p>
        </div>
        <div class="news-list stagger" id="news-list"></div>
      </div>
    </section>

    <!-- ======== 快速入口 ======== -->
    <section class="section band">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="sec.quick.eyebrow"></span>
          <h2 class="display h2" data-i18n="sec.quick.title"></h2>
          <p data-i18n="sec.quick.sub"></p>
        </div>
        <div class="quick-grid stagger">
          <a class="card quick-card reveal" href="timetable.html">
            <span class="quick-icon" aria-hidden="true">🗓️</span>
            <h3 data-i18n="quick.timetable.t"></h3>
            <p data-i18n="quick.timetable.d"></p>
          </a>
          <a class="card quick-card reveal" href="members.html">
            <span class="quick-icon" aria-hidden="true">🧑‍🤝‍🧑</span>
            <h3 data-i18n="quick.members.t"></h3>
            <p data-i18n="quick.members.d"></p>
          </a>
          <a class="card quick-card reveal" href="gallery.html">
            <span class="quick-icon" aria-hidden="true">📸</span>
            <h3 data-i18n="quick.gallery.t"></h3>
            <p data-i18n="quick.gallery.d"></p>
          </a>
          <a class="card quick-card reveal" href="index.html#about" id="about-card">
            <span class="quick-icon" aria-hidden="true">🏫</span>
            <h3 data-i18n="quick.about.t"></h3>
            <p data-i18n="quick.about.d"></p>
          </a>
        </div>
      </div>
    </section>

    <!-- ======== 班级角 ======== -->
    <section class="section" id="about">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="sec.honor.eyebrow"></span>
          <h2 class="display h2" data-i18n="sec.honor.title"></h2>
          <p data-i18n="sec.honor.sub"></p>
        </div>
        <div class="honor-grid stagger" id="honor-grid"></div>
      </div>
    </section>
  </main>

  <!-- ======== 页脚 ======== -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <img class="footer-logo" src="assets/weibiaoti-12222.png" alt="学校校徽 School Crest" onerror="this.remove()">
        <a class="brand" href="index.html">
          <span>
            <span class="brand-name">Pre A1</span>
            <span class="brand-sub">Class Hub · 班级平台</span>
          </span>
        </a>
        <p data-i18n="footer.about.desc"></p>
        <div class="footer-motto" data-i18n="footer.motto"></div>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.col.pages"></h4>
        <ul>
          <li><a href="timetable.html" data-i18n="nav.timetable"></a></li>
          <li><a href="members.html" data-i18n="nav.members"></a></li>
          <li><a href="gallery.html" data-i18n="nav.gallery"></a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.col.class"></h4>
        <ul>
          <li data-i18n="footer.col.class.school"></li>
          <li data-i18n="footer.col.class.grade"></li>
          <li data-i18n="footer.col.class.houses"></li>
        </ul>
      </div>
    </div>
    <div class="container footer-bottom">
      <span data-i18n="footer.built"></span>
      <span id="footer-rights"></span>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
